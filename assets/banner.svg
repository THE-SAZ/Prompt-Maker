<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="200" rx="15" fill="url(#bg)" />
  <!-- Border glow -->
  <rect x="5" y="5" width="1190" height="190" rx="12" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#glow)" opacity="0.7" />
  <!-- Emoji -->
  <text x="80" y="120" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif" font-size="100" fill="#ffffff">🏴‍☠️</text>
  <!-- Title -->
  <text x="180" y="100" font-family="Fira Code, monospace" font-size="42" fill="#00e5ff" font-weight="bold" filter="url(#glow)">     PROMPT MAKER V 0.0.4</text>
  <!-- Subtitle -->
  <text x="180" y="140" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" opacity="0.9">      ∆∆∆∆^THE SAZ^∆∆∆∆</text>
  <!-- Decorative line -->
  <line x1="180" y1="160" x2="1000" y2="160" stroke="#00e5ff" stroke-width="2" stroke-dasharray="10 5" opacity="0.6" />
</svg>
